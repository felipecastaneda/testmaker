# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Up to 10 servers when a class takes an exam together; idle instances scale to zero, so
  # this costs nothing extra when nobody is using it. Raise it for several large classes at once.
  maxInstances: 10

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBBeESIHUus0MQsEsHEg0tukqF9Mzbr0qg
    availability: [ "BUILD", "RUNTIME" ]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: testmaker-3fa6b.firebaseapp.com
    availability: [ "BUILD", "RUNTIME" ]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: testmaker-3fa6b
    availability: [ "BUILD", "RUNTIME" ]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: testmaker-3fa6b.firebasestorage.app
    availability: [ "BUILD", "RUNTIME" ]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "422095708584"
    availability: [ "BUILD", "RUNTIME" ]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:422095708584:web:75177d4b2985af09913d9d"
    availability: [ "BUILD", "RUNTIME" ]
  - variable: GOOGLE_GENAI_API_KEY
    secret: google_genai_api_key
  - variable: OPENAI_API_KEY
    secret: openai_api_key
  - variable: ALLOWED_EMAILS
    secret: allowed_emails
  - variable: LEGACY_OWNER_EMAIL
    secret: legacy_owner_email
  - variable: PLATFORM_ADMIN_EMAILS
    secret: platform_admin_emails
  - variable: DAILY_QUESTION_LIMIT
    value: "300"
    availability: [ "RUNTIME" ]
